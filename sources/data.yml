landscape:
  - category:
    name: Programming Languages
    subcategories:
      - subcategory:
        name: General Purpose
        items:
          - item:
            description: Object-oriented, statically typed programming language developed by Microsoft for the .NET platform, used to build web, desktop, mobile, and game applications.
            homepage_url: https://learn.microsoft.com/en-us/dotnet/csharp/
            logo: csharp-128.png
            name: C#
            repo_url: https://github.com/dotnet/csharplang
          - item:
            name: COBOL
            description: Older procedural programming language designed for business and administrative data processing, still widely used in legacy mainframe systems in banking and government.
            homepage_url: https://www.ibm.com/topics/cobol
            logo: cobol.svg
          - item:
            name: Dart
            description: Object-oriented programming language developed by Google, primarily used with the Flutter framework to build cross-platform mobile, web, and desktop applications.
            homepage_url: https://dart.dev/
            logo: dart.svg
          - item:
            name: Go
            description: Statically typed, compiled programming language created at Google, valued for its simplicity and built-in support for concurrency; commonly used for backend services and infrastructure tooling.
            homepage_url: https://go.dev/
            logo: go.svg
          - item:
            name: Groovy
            description: Dynamic programming language that runs on the Java Virtual Machine and interoperates closely with Java, often used for scripting, testing, and build automation such as Gradle.
            homepage_url: https://groovy-lang.org/
            logo: groovy.svg
          - item:
            description: Object-oriented, platform-independent programming language widely used for enterprise systems, Android app development, and large-scale backend services.
            homepage_url: https://dev.java/
            logo: openjdk2.svg
            name: Java
            repo_url: https://github.com/openjdk/jdk
          - item:
            name: Kotlin
            description: Statically typed programming language that runs on the JVM and interoperates with Java, officially supported by Google as a primary language for Android development.
            homepage_url: https://kotlinlang.org/
            logo: kotlin.svg
          - item:
            name: Lua
            description: Lightweight, embeddable scripting language commonly used to add configurable logic and extensibility to applications and video games.
            homepage_url: https://www.lua.org/
            logo: lua.svg
          - item:
            name: MATLAB
            description: Numerical computing environment and programming language used for matrix operations, data analysis, algorithm prototyping, and engineering simulations.
            homepage_url: https://www.mathworks.com/products/matlab.html
            logo: matlab.svg
          - item:
            name: PL/SQL
            description: Oracle's procedural extension of SQL, used to write stored procedures, functions, and triggers that implement business logic inside Oracle databases.
            homepage_url: https://www.oracle.com/database/technologies/appdev/plsql.html
            logo: pl-sql.svg
          - item:
            description: High-level, general-purpose programming language known for its readable syntax, widely used for web development, data science, automation, and scripting.
            homepage_url: https://python.org/
            logo: python-logo-only.svg
            name: Python
            repo_url: https://github.com/python/cpython
          - item:
            name: R
            description: Programming language and environment focused on statistical computing and graphics, commonly used for data analysis and academic research.
            homepage_url: https://www.r-project.org/
            logo: r.svg
          - item:
            name: Scratch
            description: Block-based visual programming language and online platform designed to teach programming concepts to children and beginners.
            homepage_url: https://scratch.mit.edu/
            logo: scratch.svg
          - item:
            name: Solidity
            description: Statically typed programming language designed for writing smart contracts that run on the Ethereum blockchain and compatible platforms.
            homepage_url: https://soliditylang.org/
            logo: solidity.svg
          - item:
            name: SQL
            description: Standard programming language used to query, update, and manage data stored in relational database systems.
            homepage_url: https://en.wikipedia.org/wiki/SQL
            logo: sql.svg
          - item:
            name: Swift
            description: Statically typed, compiled programming language developed by Apple for building applications on iOS, macOS, and other Apple platforms.
            homepage_url: https://www.swift.org/
            logo: swift.svg
          - item:
            name: Transact-SQL
            description: Microsoft's procedural extension of SQL used in SQL Server and Azure SQL Database for querying data and implementing stored procedures and triggers.
            homepage_url: https://learn.microsoft.com/en-us/sql/t-sql/language-reference
            logo: transact-sql.svg
          - item:
            name: VB.NET
            description: Object-oriented programming language on the .NET platform, evolved from classic Visual Basic, used mainly for building Windows desktop and enterprise applications.
            homepage_url: https://learn.microsoft.com/en-us/dotnet/visual-basic/
            logo: vb-net.svg
          - item:
            name: VBA
            description: Scripting language embedded in Microsoft Office applications, used to automate repetitive tasks and build custom functionality within documents and spreadsheets.
            homepage_url: https://learn.microsoft.com/en-us/office/vba/api/overview/
            logo: vba.svg
          - item:
            name: Visual Basic
            description: Event-driven programming language and development environment originally created by Microsoft for building Windows applications with a simplified, beginner-friendly syntax.
            homepage_url: https://learn.microsoft.com/en-us/dotnet/visual-basic/
            logo: visual-basic.svg
      - subcategory:
        name: Web & Scripting
        items:
          - item:
            name: ActionScript
            description: Object-oriented scripting language originally used with Adobe Flash to create interactive animations and web applications, now largely obsolete.
            homepage_url: https://en.wikipedia.org/wiki/ActionScript
            logo: actionscript.svg
          - item:
            name: AJAX
            description: Technique for making web browsers exchange data with a server asynchronously in the background, allowing pages to update content without a full reload.
            homepage_url: https://developer.mozilla.org/en-US/docs/Web/Guide/AJAX
            logo: ajax.svg
          - item:
            name: CSS
            description: Stylesheet language used to control the visual presentation of HTML documents, including layout, colors, fonts, and responsive design.
            homepage_url: https://developer.mozilla.org/en-US/docs/Web/CSS
            logo: css.svg
          - item:
            name: HTML
            description: Markup language used to structure content on web pages, defining elements like text, links, images, and forms.
            homepage_url: https://developer.mozilla.org/en-US/docs/Web/HTML
            logo: html.svg
          - item:
            name: HTML/CSS
            description: Combined use of the markup language HTML for structuring web content and CSS for styling its visual presentation, forming the core of front-end web development.
            homepage_url: https://developer.mozilla.org/en-US/docs/Web/HTML
            logo: html-css.svg
          - item:
            name: HTML5
            description: Version of HTML that adds semantic elements, multimedia support, and APIs for building modern interactive web applications without relying on plugins.
            homepage_url: https://developer.mozilla.org/en-US/docs/Web/HTML
            logo: html5.svg
          - item:
            description: Scripting language used to add interactivity and dynamic behavior to web pages, and also used server-side and in many application environments.
            homepage_url: https://ecma-international.org/publications-and-standards/standards/ecma-262/
            logo: javascript.svg
            name: JavaScript
          - item:
            name: Liquid
            description: Template language used to embed dynamic content and logic into web pages, commonly used for building themes on the Shopify e-commerce platform.
            homepage_url: https://shopify.github.io/liquid/
            logo: liquid.svg
          - item:
            name: Perl
            description: General-purpose scripting language known for strong text-processing capabilities, historically popular for system administration and web CGI scripts.
            homepage_url: https://www.perl.org/
            logo: perl.svg
          - item:
            name: PHP
            description: Server-side scripting language designed for web development, used to generate dynamic web pages and interact with databases.
            homepage_url: https://www.php.net/
            logo: php.svg
          - item:
            name: PowerShell
            description: Command-line shell and scripting language used for task automation and configuration management, particularly on Windows and cloud systems.
            homepage_url: https://learn.microsoft.com/en-us/powershell/
            logo: powershell.svg
          - item:
            name: Ruby
            description: General-purpose, dynamic programming language known for its clean syntax and readability, widely used for web development via frameworks like Rails.
            homepage_url: https://www.ruby-lang.org/
            logo: ruby.svg
          - item:
            name: Sass
            description: CSS preprocessor that adds features like variables, nesting, and mixins to make writing and maintaining stylesheets more efficient.
            homepage_url: https://sass-lang.com/
            logo: sass.svg
          - item:
            description: Statically typed superset of JavaScript that compiles to plain JavaScript, adding type checking to help catch errors during development.
            homepage_url: https://www.typescriptlang.org/
            logo: typescript.svg
            name: TypeScript
            repo_url: https://github.com/microsoft/TypeScript
          - item:
            name: VBScript
            description: Lightweight scripting language developed by Microsoft, historically used for automating tasks in Windows and for client-side scripting in Internet Explorer.
            homepage_url: https://learn.microsoft.com/en-us/previous-versions/t0aew7h6(v=vs.85)
            logo: vbscript.svg
          - item:
            name: XAML
            description: Markup language used to define user interfaces declaratively in .NET applications, such as those built with WPF or UWP.
            homepage_url: https://learn.microsoft.com/en-us/dotnet/desktop/wpf/xaml/
            logo: xaml.svg
      - subcategory:
        name: Systems
        items:
          - item:
            name: Bash
            description: Unix shell and command language used for interacting with the operating system and writing automation scripts, common on Linux and macOS.
            homepage_url: https://www.gnu.org/software/bash/
            logo: bash.svg
          - item:
            name: Batch Script
            description: Scripting language used to automate sequences of commands on Windows systems via the command-line interpreter.
            homepage_url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/batch
            logo: batch-script.svg
          - item:
            name: C
            description: Low-level, general-purpose programming language known for its efficiency and close relationship to hardware, widely used in operating systems and embedded software.
            homepage_url: https://en.wikipedia.org/wiki/C_(programming_language)
            logo: c.svg
          - item:
            name: C++
            description: General-purpose programming language extending C with object-oriented and generic programming features, used in performance-critical applications like games and systems software.
            homepage_url: https://isocpp.org/
            logo: cplusplus.svg
          - item:
            name: C/C++
            description: Pairing of the C and C++ programming languages, often grouped together due to their shared syntax and use in systems-level and performance-critical software.
            homepage_url: https://isocpp.org/
            logo: c-cplusplus.svg
          - item:
            name: KornShell (ksh)
            description: Unix command-line shell and scripting language that combines features of the Bourne shell and C shell, used for interactive command execution and shell scripting.
            homepage_url: https://en.wikipedia.org/wiki/KornShell
            logo: kornshell-ksh.svg
          - item:
            name: Objective-C
            description: General-purpose, object-oriented programming language that extends C with Smalltalk-style messaging, historically the primary language for macOS and iOS application development.
            homepage_url: https://developer.apple.com/library/archive/documentation/Cocoa/Conceptual/ProgrammingWithObjectiveC/Introduction/Introduction.html
            logo: objective-c.svg
  - category:
    name: Frameworks & Libraries
    subcategories:
      - subcategory:
        name: Backend Frameworks
        items:
          - item:
            name: .NET
            description: Cross-platform developer platform from Microsoft used to build web, desktop, mobile, cloud, and IoT applications across multiple programming languages.
            homepage_url: https://dotnet.microsoft.com/
            logo: net.svg
          - item:
            name: .NET Core
            description: Cross-platform, open-source implementation of .NET that ran on Windows, Linux, and macOS before being unified into the modern .NET platform.
            homepage_url: https://dotnet.microsoft.com/
            logo: net-core.svg
          - item:
            name: .NET Framework
            description: Original Windows-only implementation of .NET, providing a runtime and class libraries for building desktop and web applications on Windows.
            homepage_url: https://dotnet.microsoft.com/en-us/download/dotnet-framework
            logo: net-framework.svg
          - item:
            name: .NET Standard
            description: Specification defining a common set of APIs that different .NET implementations must support, enabling code and libraries to be shared across them.
            homepage_url: https://learn.microsoft.com/en-us/dotnet/standard/net-standard
            logo: net-standard.svg
          - item:
            name: Akka
            description: Toolkit for building concurrent, distributed, and fault-tolerant applications on the JVM using the actor model for message-driven processing.
            homepage_url: https://akka.io/
            logo: akka.svg
          - item:
            name: Apache CXF
            description: Open-source Java framework for building and consuming web services, supporting both SOAP-based and RESTful service styles.
            homepage_url: https://cxf.apache.org/
            logo: apache-cxf.svg
          - item:
            name: Apache Tomcat
            description: Open-source Java servlet container that implements core Java EE web specifications, used to deploy and run Java web applications.
            homepage_url: https://tomcat.apache.org/
            logo: apache-tomcat.svg
          - item:
            homepage_url: https://learn.microsoft.com/en-us/aspnet/core/
            logo: dotnet.svg
            name: ASP.NET
            description: Web application framework from Microsoft for building dynamic websites, services, and APIs on the .NET platform.
          - item:
            name: ASP.NET Core
            description: Cross-platform, open-source web framework from Microsoft, succeeding ASP.NET, used to build web apps, APIs, and microservices on modern .NET.
            homepage_url: https://dotnet.microsoft.com/en-us/apps/aspnet
            logo: asp-net-core.svg
          - item:
            name: ASP.NET Web Forms
            description: Component of the original ASP.NET framework for building web applications using event-driven, server-side UI controls similar to desktop application development.
            homepage_url: https://learn.microsoft.com/en-us/aspnet/web-forms/
            logo: asp-net-web-forms.svg
          - item:
            name: AutoMapper
            description: Library for .NET that automates the mapping of properties between objects, commonly used to convert between domain models and data transfer objects.
            homepage_url: https://automapper.org/
            logo: automapper.svg
          - item:
            name: Castle Windsor
            description: Inversion of control container for .NET applications, used to manage object creation and dependency injection.
            homepage_url: http://www.castleproject.org/projects/windsor/
            logo: castle-windsor.svg
          - item:
            name: Dapper
            description: Lightweight object-relational mapper for .NET that extends ADO.NET to map SQL query results to objects with minimal overhead.
            homepage_url: https://github.com/DapperLib/Dapper
            logo: dapper.svg
          - item:
            name: Django
            description: High-level Python web framework that follows the model-view-template pattern, designed for rapid development of secure, maintainable websites.
            homepage_url: https://www.djangoproject.com/
            logo: django.svg
          - item:
            name: Drupal
            description: Open-source content management system written in PHP, used to build, manage, and publish content-driven websites and web applications.
            homepage_url: https://www.drupal.org/
            logo: drupal.svg
          - item:
            name: Eclipse Jetty
            description: Lightweight, embeddable Java HTTP server and servlet container, often used to power web applications and services within larger Java programs.
            homepage_url: https://www.eclipse.org/jetty/
            logo: eclipse-jetty.svg
          - item:
            name: EJS
            description: Templating engine for JavaScript that generates HTML markup by embedding plain JavaScript code, commonly used with Node.js web applications.
            homepage_url: https://ejs.co/
            logo: ejs.svg
          - item:
            name: Entity Framework
            description: Object-relational mapping framework for .NET that lets developers interact with databases using .NET objects instead of writing raw SQL.
            homepage_url: https://learn.microsoft.com/en-us/ef/
            logo: entity-framework.svg
          - item:
            name: Express
            description: Minimalist web application framework for Node.js that provides routing, middleware, and HTTP utilities for building web servers and APIs.
            homepage_url: https://expressjs.com/
            logo: express.svg
          - item:
            name: Express.js
            description: Minimalist web application framework for Node.js that provides routing, middleware, and HTTP utilities for building web servers and APIs.
            homepage_url: https://expressjs.com/
            logo: express-js.svg
          - item:
            name: Flask
            description: Lightweight Python web framework that offers routing and templating basics while leaving other components like databases up to the developer.
            homepage_url: https://flask.palletsprojects.com/
            logo: flask.svg
          - item:
            name: GraphQL
            description: Query language and runtime for APIs that lets clients request exactly the data fields they need from a server in a single call.
            homepage_url: https://graphql.org/
            logo: graphql.svg
          - item:
            name: gRPC
            description: Open-source remote procedure call framework that uses protocol buffers for efficient, strongly-typed communication between services, often across languages.
            homepage_url: https://grpc.io/
            logo: grpc.svg
          - item:
            name: JBoss (WildFly)
            description: Java EE / Jakarta EE application server used to deploy and run enterprise Java applications, handling services like transactions, security, and messaging.
            homepage_url: https://www.wildfly.org/
            logo: jboss-wildfly.svg
          - item:
            name: JSON Server
            description: Command-line tool that spins up a full fake REST API from a JSON file, useful for prototyping frontends without a real backend.
            homepage_url: https://github.com/typicode/json-server
            logo: json-server.svg
          - item:
            name: Laravel
            description: PHP web application framework that provides tools for routing, ORM, templating, and authentication to build web applications following the MVC pattern.
            homepage_url: https://laravel.com/
            logo: laravel.svg
          - item:
            name: LINQ
            description: Language-integrated query feature in .NET that lets developers write set-based queries over collections, databases, and XML directly in C# or VB.NET syntax.
            homepage_url: https://learn.microsoft.com/en-us/dotnet/csharp/linq/
            logo: linq.svg
          - item:
            name: MediatR
            description: .NET library implementing the mediator pattern, used to decouple in-process request/response handling and event notifications between components.
            homepage_url: https://github.com/jbogard/MediatR
            logo: mediatr.svg
          - item:
            name: Microsoft Graph API
            description: Unified REST API and SDK that lets applications access data and services across Microsoft 365, such as Outlook, Teams, and Azure Active Directory.
            homepage_url: https://learn.microsoft.com/en-us/graph/
            logo: microsoft-graph-api.svg
          - item:
            name: Moshi
            description: JSON serialization library for Java and Kotlin (commonly used on Android) that converts objects to and from JSON with reflection or generated adapters.
            homepage_url: https://github.com/square/moshi
            logo: moshi.svg
          - item:
            name: NestJS
            description: TypeScript-based Node.js framework for building scalable server-side applications, providing a modular architecture inspired by Angular along with dependency injection.
            homepage_url: https://nestjs.com/
            logo: nestjs.svg
          - item:
            name: NHibernate
            description: Object-relational mapping framework for .NET that maps classes to relational database tables, handling data persistence and querying.
            homepage_url: https://nhibernate.info/
            logo: nhibernate.svg
          - item:
            name: Node.js
            description: JavaScript runtime built on Chrome's V8 engine that enables running JavaScript outside the browser, commonly used to build servers and command-line tools.
            homepage_url: https://nodejs.org/
            logo: node-js.svg
          - item:
            name: Quarkus
            description: Java framework optimized for building cloud-native, containerized applications with fast startup times and low memory footprint, often used with Kubernetes.
            homepage_url: https://quarkus.io/
            logo: quarkus.svg
          - item:
            name: Razor
            description: Markup syntax used in ASP.NET Core for embedding server-side C# code within HTML to generate dynamic web page views.
            homepage_url: https://learn.microsoft.com/en-us/aspnet/core/mvc/views/razor
            logo: razor.svg
          - item:
            name: Retrofit
            description: Type-safe HTTP client library for Java and Android that turns REST API endpoints into simple Java interface method calls.
            homepage_url: https://square.github.io/retrofit/
            logo: retrofit.svg
          - item:
            name: Ruby on Rails
            description: Web application framework written in Ruby that follows the MVC pattern and convention-over-configuration principles to speed up building database-backed web apps.
            homepage_url: https://rubyonrails.org/
            logo: ruby-on-rails.svg
          - item:
            name: Socket.IO
            description: JavaScript library that enables real-time, bidirectional communication between web clients and servers, built on top of WebSockets with fallback support.
            homepage_url: https://socket.io/
            logo: socket-io.svg
          - item:
            homepage_url: https://spring.io/projects/spring-boot
            logo: spring-boot.svg
            name: Spring Boot
            description: Java framework that simplifies building standalone, production-ready Spring applications by providing auto-configuration and embedded servers, reducing boilerplate setup.
          - item:
            name: Spring Data
            description: Part of the Spring ecosystem that simplifies data access, offering consistent, repository-based abstractions for working with relational and NoSQL databases.
            homepage_url: https://spring.io/projects/spring-data
            logo: spring-data.svg
          - item:
            name: Spring MVC
            description: Web framework within Spring for building server-side Java web applications and REST APIs using the model-view-controller pattern.
            homepage_url: https://docs.spring.io/spring-framework/reference/web/webmvc.html
            logo: spring-mvc.svg
          - item:
            name: Spring WebFlux
            description: Reactive web framework within Spring for building non-blocking, asynchronous web applications and APIs on top of reactive streams.
            homepage_url: https://docs.spring.io/spring-framework/reference/web/webflux.html
            logo: spring-webflux.svg
          - item:
            name: Unity Container
            description: Lightweight dependency injection container for .NET applications that helps manage object creation and lifetime to support loosely coupled designs.
            homepage_url: https://github.com/unitycontainer/unity
            logo: unity-container.svg
          - item:
            name: Windows Communication Foundation (WCF)
            description: .NET framework for building service-oriented applications, enabling communication between distributed systems using configurable protocols and bindings.
            homepage_url: https://learn.microsoft.com/en-us/dotnet/framework/wcf/
            logo: windows-communication-foundation-wcf.svg
          - item:
            name: WordPress
            description: Open-source content management system used to build and manage websites and blogs, extensible through plugins and themes.
            homepage_url: https://wordpress.org/
            logo: wordpress.svg
      - subcategory:
        name: Frontend Frameworks
        items:
          - item:
            name: AmCharts
            description: JavaScript charting and data visualization library used to create interactive charts, graphs, and maps for web applications.
            homepage_url: https://www.amcharts.com/
            logo: amcharts.svg
          - item:
            homepage_url: https://angular.dev/
            logo: angular.svg
            name: Angular
            description: TypeScript-based web application framework maintained by Google for building single-page applications with a component-based architecture.
          - item:
            name: AngularJS
            description: Original JavaScript-based front-end framework from Google for building dynamic single-page web applications, predecessor to the rewritten Angular framework.
            homepage_url: https://angularjs.org/
            logo: angularjs.svg
          - item:
            name: Aurelia
            description: JavaScript front-end framework for building single-page applications and web components with an emphasis on standards-based, convention-driven development.
            homepage_url: https://aurelia.io/
            logo: aurelia.svg
          - item:
            name: Axios
            description: Promise-based HTTP client for JavaScript used in browsers and Node.js to make requests to APIs and handle responses.
            homepage_url: https://axios-http.com/
            logo: axios.svg
          - item:
            name: Babel
            description: JavaScript compiler that converts modern ECMAScript syntax into backward-compatible versions so code runs on older browsers and environments.
            homepage_url: https://babeljs.io/
            logo: babel.svg
          - item:
            name: Blazor
            description: Web framework from Microsoft that lets developers build interactive web UIs using C# and .NET instead of JavaScript, running on the server or in the browser via WebAssembly.
            homepage_url: https://learn.microsoft.com/en-us/aspnet/core/blazor/
            logo: blazor.svg
          - item:
            name: Bootstrap
            description: Front-end CSS framework that provides pre-built components and a responsive grid system for quickly designing web page layouts.
            homepage_url: https://getbootstrap.com/
            logo: bootstrap.svg
          - item:
            name: D3.js
            description: JavaScript library for producing dynamic, interactive data visualizations in web browsers by binding data to DOM elements and SVG.
            homepage_url: https://d3js.org/
            logo: d3-js.svg
          - item:
            name: Docusaurus
            description: Static site generator built with React designed for creating documentation websites, with support for versioning and Markdown content.
            homepage_url: https://docusaurus.io/
            logo: docusaurus.svg
          - item:
            name: Electron
            description: Framework for building cross-platform desktop applications using web technologies like JavaScript, HTML, and CSS, combining Chromium and Node.js.
            homepage_url: https://www.electronjs.org/
            logo: electron.svg
          - item:
            name: jQuery
            description: JavaScript library that simplifies DOM manipulation, event handling, and AJAX requests, historically widely used to write cross-browser compatible scripts.
            homepage_url: https://jquery.com/
            logo: jquery.svg
          - item:
            name: Kendo UI
            description: Commercial UI component library providing widgets and controls for building web applications, with versions for various JavaScript frameworks.
            homepage_url: https://www.telerik.com/kendo-ui
            logo: kendo-ui.svg
          - item:
            name: Knockout.js
            description: JavaScript library that implements the Model-View-ViewModel pattern, enabling automatic UI updates through observable data binding.
            homepage_url: https://knockoutjs.com/
            logo: knockout-js.svg
          - item:
            name: Moment.js
            description: JavaScript library for parsing, validating, manipulating, and formatting dates and times. Widely used in older web projects, though now in maintenance mode with lighter alternatives recommended for new code.
            homepage_url: https://momentjs.com/
            logo: moment-js.svg
          - item:
            name: Next.js
            description: React framework that adds server-side rendering, static site generation, routing, and API routes on top of React. Used to build production-ready web applications with improved performance and SEO.
            homepage_url: https://nextjs.org/
            repo_url: https://github.com/vercel/next.js
            logo: nextjs-logotype-light-background.svg
          - item:
            name: NgRx
            description: State management library for Angular applications based on reactive programming and the Redux pattern, using RxJS observables to manage application state and side effects in a predictable way.
            homepage_url: https://ngrx.io/
            logo: ngrx.svg
          - item:
            name: PrimeNG
            description: UI component library for Angular providing a large collection of ready-made widgets like tables, charts, and forms to speed up building application interfaces.
            homepage_url: https://primeng.org/
            logo: primeng.svg
          - item:
            homepage_url: https://react.dev/
            logo: react.svg
            name: React
